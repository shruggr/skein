# The kernel built, then the host's tests and the kernel's equivalence suite
# (README.md, "Build and test"), on Ubuntu.
#
# Runs without secrets. The network it uses is GitHub and npm: the SDK
# (a Zig package by URL+hash), the wasmtime C API release, and the public
# app repos the equiv drivers clone at their pinned commits (src/testapps.ts
# and the drivers). Skipped here, each with a line in the suite's output:
#   - the browser parts (SKEIN_EQUIV_BROWSER=0): they need Playwright and a
#     Chromium;
#   - the component cases (shell tools, the wallet as a component): they need
#     wasm-tools and the preview1 adapter, which are not installed here.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      WASMTIME_VERSION: v49.0.1
    steps:
      - uses: actions/checkout@v4

      # Zig as mise.toml pins it (0.16.0); equiv/run.sh calls `mise exec -- zig`.
      - uses: jdx/mise-action@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: System libraries (SQLite for the kernel)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: The wasmtime C API (kernel-zig/README.md, "Build")
        run: |
          dir="$HOME/.local/wasmtime-c-api"
          mkdir -p "$dir"
          name="wasmtime-${WASMTIME_VERSION}-x86_64-linux-c-api"
          curl -fsSL "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${name}.tar.xz" | tar -xJ -C "$dir"
          echo "WASMTIME_C_API=$dir/$name" >> "$GITHUB_ENV"

      - run: npm ci

      - name: skein-host starts (its imports resolve)
        run: SKEIN_HOME="$RUNNER_TEMP/skein-home" bin/skein-host --help

      - name: Build the kernel
        working-directory: kernel-zig
        run: mise exec -- zig build --release

      - name: The kernel's unit tests
        working-directory: kernel-zig
        run: mise exec -- zig build test --summary all

      - name: Typecheck
        run: npm run typecheck && npm run web:typecheck

      # The kernel is built, so no test is skipped for want of it.
      - name: npm test
        run: npm test

      - name: The equivalence suite (browser and component parts skipped, see above)
        env:
          SKEIN_EQUIV_BROWSER: "0"
        run: kernel-zig/equiv/run.sh
