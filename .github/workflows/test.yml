# The kernel built from a clean checkout, then its unit tests, the host's tests
# and the kernel's scenarios (README.md, "Build and test"), on Ubuntu.
#
# Runs without secrets. The network it uses is GitHub and npm: the SDK and bsvz
# (Zig packages by URL+hash, fetched by the build into kernel-zig/zig-pkg), the
# wasmtime C API release (scripts/wasmtime-c-api.sh), and the public app repos
# the scenarios clone at their pinned commits (src/testapps.ts and the drivers).
#
# Not run here, each with a line in the suite's output:
#   - the browser parts of equiv/run.sh (SKEIN_EQUIV_BROWSER=0: browser-live.ts,
#     libp2p.ts's live step, site.ts): they need Playwright and a Chromium,
#     which this job does not install;
#   - the component cases (shell tools, the wallet as a component): they need
#     wasm-tools and the preview1 adapter, which are not installed here.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Zig as mise.toml pins it (0.16.0); equiv/run.sh calls `mise exec -- zig`.
      - uses: jdx/mise-action@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: System libraries (SQLite and RocksDB, linked by the kernel)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev librocksdb-dev

      - name: The wasmtime C API (kernel-zig/README.md, "Build")
        run: scripts/wasmtime-c-api.sh

      - run: npm ci

      - name: skein-host starts (its imports resolve)
        run: SKEIN_HOME="$RUNNER_TEMP/skein-home" bin/skein-host --help

      - name: Build the kernel
        working-directory: kernel-zig
        run: mise exec -- zig build --release

      - name: The kernel's unit tests
        working-directory: kernel-zig
        run: mise exec -- zig build test --summary all

      - name: Typecheck
        run: npm run typecheck && npm run web:typecheck

      # The kernel is built, so no test is skipped for want of it.
      - name: npm test
        run: npm test

      - name: The scenarios (browser parts not run, see above)
        env:
          SKEIN_EQUIV_BROWSER: "0"
        run: kernel-zig/equiv/run.sh
