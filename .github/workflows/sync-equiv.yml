# Temporary (overlay-sync branch only): the overlay sync driver alone, for quick runs.
name: sync-equiv

on:
  push:
    branches: [overlay-sync]

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      WASMTIME_VERSION: v49.0.1
    steps:
      - uses: actions/checkout@v4

      # Zig as mise.toml pins it (0.16.0); equiv/run.sh calls `mise exec -- zig`.
      - uses: jdx/mise-action@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: System libraries (SQLite for the kernel)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: The wasmtime C API (kernel-zig/README.md, "Build")
        run: |
          dir="$HOME/.local/wasmtime-c-api"
          mkdir -p "$dir"
          name="wasmtime-${WASMTIME_VERSION}-x86_64-linux-c-api"
          curl -fsSL "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${name}.tar.xz" | tar -xJ -C "$dir"
          echo "WASMTIME_C_API=$dir/$name" >> "$GITHUB_ENV"

      - run: npm ci

      - name: skein-host starts (its imports resolve)
        run: SKEIN_HOME="$RUNNER_TEMP/skein-home" bin/skein-host --help

      - name: Build the kernel
        working-directory: kernel-zig
        run: mise exec -- zig build --release

      - name: kernel-zig/equiv/sync.ts, three times, then the blocks a replay lacks
        env:
          KEEP: "1"
        run: |
          set +e
          st=0
          for i in 1 2 3; do node --experimental-strip-types --no-warnings kernel-zig/equiv/sync.ts || st=1; done
          node --experimental-strip-types --no-warnings kernel-zig/equiv/blockdiff.ts /tmp/skein-kz-sync-*/*/instances/*/runtime.db
          exit $st
